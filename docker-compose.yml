version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: avicola-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avicola_db}
      POSTGRES_USER: ${POSTGRES_USER:-avicola_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecretPassword2026!}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - avicola-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avicola_user -d avicola_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  springboot-api:
    build:
      context: ./backend-monolith
      dockerfile: Dockerfile
    container_name: avicola-backend
    restart: always
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB:-avicola_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-avicola_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-SecretPassword2026!}
      JWT_SECRET: ${JWT_SECRET:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
    ports:
      - "8080:8080"
    networks:
      - avicola-network

  nextjs-app:
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile
    container_name: avicola-frontend
    restart: always
    depends_on:
      - springboot-api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    networks:
      - avicola-network

volumes:
  postgres-data:
    name: avicola_postgres_data

networks:
  avicola-network:
    name: avicola_network
    driver: bridge
