spring.application.name=backend-monolith
server.port=8080

# Configuracion de PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/avicola_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avicola_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:SecretPassword2026!}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Secret (Clave de 256 bits) y Expiracion (8 horas)
jwt.secret=${JWT_SECRET:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
jwt.expiration=28800000

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
